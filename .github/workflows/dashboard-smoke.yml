name: Dashboard smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run dashboard regression tests
        run: python -m unittest tests.test_launch_strategy tests.test_streamlit_pages
