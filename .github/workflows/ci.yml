name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reef
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: reef_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reef -d reef_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DEV_AUTH_BYPASS: 'true'
      DATABASE_URL: postgresql+psycopg://reef:test-only-password@127.0.0.1:5432/reef_test
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DB_POOL_SIZE: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - name: Install locked dependencies
        run: |
          npm ci
          python -m venv .venv
          .venv/bin/pip install -r apps/api/requirements.lock.txt
          .venv/bin/pip install --no-deps -e apps/api
      - name: Python checks and database tests
        run: |
          .venv/bin/ruff check --config apps/api/pyproject.toml apps/api
          .venv/bin/alembic -c apps/api/alembic.ini upgrade head
          .venv/bin/pytest apps/api/tests --cov=reef --cov-report=term-missing
      - name: TypeScript and frontend tests
        run: |
          npm run typecheck
          npm test
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
