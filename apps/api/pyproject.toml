[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-launch-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]>=0.35,<1", "SQLAlchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2.10,<4", "pydantic-settings>=2.10,<3", "alembic>=1.16,<2",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["reef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
