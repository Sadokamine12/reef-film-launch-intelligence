services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reef
      POSTGRES_USER: reef
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - reef-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reef -d reef"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://reef:${POSTGRES_PASSWORD}@db:5432/reef
      CORS_ORIGINS: ${APP_ORIGIN:-http://localhost:3000}
      DEV_AUTH_BYPASS: "false"
      REEF_ADMIN_EMAIL: ${REEF_ADMIN_EMAIL:?Set REEF_ADMIN_EMAIL}
      REEF_ADMIN_PASSWORD: ${REEF_ADMIN_PASSWORD:?Set REEF_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    environment:
      API_BASE_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  reef-data:
